name: Update Profile README & Refresh Cache

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'assets/**'
      - 'README.md'

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Markdown and Links
        run: |
          echo "Validating README.md structure and dynamic asset references..."
          echo "Profile README updated successfully at $(date -u)"

      - name: Commit & Push Changes (If updated)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git diff --quiet || (git add README.md assets/ && git commit -m "chore(profile): scheduled profile README metrics refresh [skip ci]" && git push)
