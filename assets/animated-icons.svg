<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="glow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18px; font-weight: 700; fill: #C9D1D9; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; fill: #8B949E; }
    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .pulse-target { transform-origin: center; animation: pulseIcon 3s ease-in-out infinite; }
  </style>

  <!-- Card 1: Full-Stack Engineering -->
  <g transform="translate(15, 20)">
    <rect width="275" height="200" rx="16" fill="url(#card-grad)" stroke="url(#glow-border)" stroke-width="1.5" />
    <g transform="translate(30, 30)">
      <circle cx="28" cy="28" r="24" fill="#1F6FEB" fill-opacity="0.2" stroke="#58A6FF" stroke-width="1.5" class="pulse-target" />
      <path d="M 18 28 L 24 34 L 38 20" stroke="#58A6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="30" y="115" class="card-title">Full-Stack Dev</text>
    <text x="30" y="142" class="card-sub">MERN, Java &amp; Spring</text>
    <text x="30" y="162" class="card-sub">Scalable Web Systems</text>
  </g>

  <!-- Card 2: Cloud & DevOps -->
  <g transform="translate(310, 20)">
    <rect width="275" height="200" rx="16" fill="url(#card-grad)" stroke="url(#glow-border)" stroke-width="1.5" />
    <g transform="translate(30, 30)">
      <circle cx="28" cy="28" r="24" fill="#BB9AF7" fill-opacity="0.2" stroke="#BB9AF7" stroke-width="1.5" class="pulse-target" />
      <path d="M 20 32 C 18 32 16 30 16 27 C 16 24 18 22 21 22 C 22 18 26 16 30 18 C 34 16 39 19 39 23 C 41 23 43 25 43 28 C 43 31 41 32 38 32 Z" fill="none" stroke="#BB9AF7" stroke-width="2" />
    </g>
    <text x="30" y="115" class="card-title">Cloud &amp; DevOps</text>
    <text x="30" y="142" class="card-sub">Docker, Kubernetes</text>
    <text x="30" y="162" class="card-sub">AWS Cloud Deployments</text>
  </g>

  <!-- Card 3: Database & Backend Architecture -->
  <g transform="translate(605, 20)">
    <rect width="275" height="200" rx="16" fill="url(#card-grad)" stroke="url(#glow-border)" stroke-width="1.5" />
    <g transform="translate(30, 30)">
      <circle cx="28" cy="28" r="24" fill="#7EE787" fill-opacity="0.2" stroke="#7EE787" stroke-width="1.5" class="pulse-target" />
      <ellipse cx="28" cy="20" rx="14" ry="5" fill="none" stroke="#7EE787" stroke-width="2" />
      <path d="M 14 20 v 8 c 0 3 6 5 14 5 s 14 -2 14 -5 v -8" fill="none" stroke="#7EE787" stroke-width="2" />
      <path d="M 14 28 v 8 c 0 3 6 5 14 5 s 14 -2 14 -5 v -8" fill="none" stroke="#7EE787" stroke-width="2" />
    </g>
    <text x="30" y="115" class="card-title">Database Systems</text>
    <text x="30" y="142" class="card-sub">MongoDB &amp; MySQL</text>
    <text x="30" y="162" class="card-sub">RESTful API Design</text>
  </g>

  <!-- Card 4: Problem Solving & Algorithms -->
  <g transform="translate(900, 20)">
    <rect width="275" height="200" rx="16" fill="url(#card-grad)" stroke="url(#glow-border)" stroke-width="1.5" />
    <g transform="translate(30, 30)">
      <circle cx="28" cy="28" r="24" fill="#7AA2F7" fill-opacity="0.2" stroke="#7AA2F7" stroke-width="1.5" class="pulse-target" />
      <path d="M 22 18 L 16 28 L 22 38 M 34 18 L 40 28 L 34 38 M 30 16 L 26 40" stroke="#7AA2F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="30" y="115" class="card-title">Problem Solving</text>
    <text x="30" y="142" class="card-sub">Data Structures &amp; Algo</text>
    <text x="30" y="162" class="card-sub">LeetCode &amp; Clean Code</text>
  </g>
</svg>
