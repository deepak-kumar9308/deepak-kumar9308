<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="avatar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#1F6FEB" />
      <stop offset="100%" stop-color="#BB9AF7" />
    </linearGradient>

    <filter id="frame-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes spin-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-inner {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .spinning-border { transform-origin: 120px 120px; animation: spin-ring 12s linear infinite; }
    .inner-avatar-glass { transform-origin: 120px 120px; animation: pulse-inner 4s ease-in-out infinite; }
  </style>

  <!-- Outer Pulsing Glow Circle -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#avatar-glow)" stroke-width="2" opacity="0.3" filter="url(#frame-blur)" />

  <!-- Animated Dashed Spinning Ring -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#avatar-glow)" stroke-width="3" stroke-dasharray="16 12" stroke-linecap="round" class="spinning-border" />

  <!-- Inner Glass Frame Container -->
  <circle cx="120" cy="120" r="92" fill="#161B22" fill-opacity="0.8" stroke="#30363D" stroke-width="2" class="inner-avatar-glass" />
  
  <!-- Developer Initials / Placeholder Graphic inside SVG -->
  <circle cx="120" cy="100" r="32" fill="#1F6FEB" fill-opacity="0.3" stroke="#58A6FF" stroke-width="1.5" />
  <path d="M 80 170 C 80 140 100 135 120 135 C 140 135 160 140 160 170 Z" fill="#58A6FF" fill-opacity="0.3" stroke="#58A6FF" stroke-width="1.5" />
  
  <text x="120" y="107" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#58A6FF" text-anchor="middle">DK</text>
</svg>
